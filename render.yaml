# Render Blueprint - deploy API bai do xe (goi Free)
# Render Dashboard -> New -> Blueprint -> chon repo nay
services:
  - type: web
    name: smart-parking-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render tu sinh chuoi ngau nhien
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MQTT_TOPIC_PREFIX
        value: smartparking
      - key: DEVICE_TIMEOUT_MS
        value: "8000"
      # Cac bien bi mat: Render se hoi khi tao Blueprint
      - key: DATABASE_URL
        sync: false
      # Broker cong khai (HiveMQ Cloud khong con goi free). Neu doi sang broker rieng:
      # them MQTT_USERNAME / MQTT_PASSWORD va doi MQTT_URL thanh mqtts://...:8883
      - key: MQTT_URL
        value: mqtt://broker.hivemq.com:1883
      # Tai khoan admin: tao/doi mat khau tu may bang `npm run set-admin` (khong luu tren Render)
